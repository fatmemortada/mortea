app = "mortea"
primary_region = "yyz"

[deploy]
  release_command = "sh -c 'python manage.py migrate --noinput && python manage.py seed_beauty_providers'"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1


[http_service.concurrency]
  type = "requests"
  hard_limit = 50
  soft_limit = 25

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
