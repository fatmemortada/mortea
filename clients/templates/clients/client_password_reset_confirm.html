<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Set New Password — Mortacc</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,Arial;background:#f8fafc;margin:0}.wrap{max-width:440px;margin:80px auto;padding:20px}.card{background:#fff;padding:36px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.06)}.logo{font-family:'DM Serif Display',serif;font-size:26px;margin-bottom:20px}.logo span{color:#2563eb}h1{margin:0 0 8px;font-size:24px}.sub{color:#64748b;margin-bottom:24px;font-size:14px}input{width:100%;padding:12px;margin-bottom:14px;border-radius:8px;border:1px solid #e2e8f0;font-size:14px;box-sizing:border-box}input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}button{width:100%;padding:14px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer;font-size:15px}button:hover{background:#1d4ed8}.error{background:#fef2f2;color:#b91c1c;padding:12px;border-radius:8px;margin-bottom:15px;font-size:14px}.done{background:#dcfce7;color:#15803d;padding:24px;border-radius:8px;text-align:center;font-size:15px}.done a{color:#2563eb;font-weight:600}</style></head>
<body><div class="wrap"><div class="card">
<div class="logo">Mort<span>acc</span></div>
{% if done %}
<h1>Password Set!</h1><div class="done"><p>Your password has been changed successfully.</p><p style="margin-top:12px"><a href="{% url 'client_login' %}">Log in with your new password →</a></p></div>
{% else %}
<h1>Set New Password</h1><p class="sub">Choose a new password for your client portal.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="POST">{% csrf_token %}
<input type="password" name="password" placeholder="New password (min 8 characters)" required>
<input type="password" name="confirm_password" placeholder="Confirm new password" required>
<button type="submit">Set Password</button>
</form>
{% endif %}
</div></div></body></html>
