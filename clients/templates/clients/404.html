{% extends "clients/base.html" %}
{% block title %}Page Not Found — Mortea{% endblock %}

{% block content %}
<div style="max-width:600px;margin:80px auto;text-align:center;padding:40px 20px;">
    <div style="font-size:72px;margin-bottom:16px;">🔍</div>
    <h1 style="font-size:28px;font-weight:700;color:var(--ink);margin:0 0 8px;">Page Not Found</h1>
    <p style="font-size:16px;color:var(--muted);margin:0 0 32px;line-height:1.6;">
        The page you're looking for doesn't exist or has been moved.<br>
        If you typed the URL, double-check the spelling.
    </p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <a href="/" class="btn btn-primary">Return Home</a>
        <a href="mailto:support@mortacc.com" class="btn btn-ghost">Contact Support</a>
    </div>
</div>
{% endblock %}
