{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Sign In — Mortea</title>
    <meta name="description" content="Sign in to your Mortea client account to view your bookings, saved providers, and appointment history.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{% static 'clients/icons/favicon.svg' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'clients/icons/favicon-32.png' %}">
    <link rel="shortcut icon" href="{% static 'clients/icons/favicon.ico' %}">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0D0D0D; --card: #161616; --card-border: #222;
            --accent: #D4B08C; --text: #FFFFFF; --text-secondary: #CFCFCF;
            --text-muted: #8A8A8A; --text-faint: #5A5A5A;
            --error: #D4756B; --error-bg: rgba(212,117,107,0.1);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg); min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px; color: var(--text); -webkit-font-smoothing: antialiased;
        }
        .wrap { width: 100%; max-width: 440px; }
        .card {
            background: var(--card); border: 1px solid var(--card-border);
            border-radius: 20px; padding: 40px;
        }
        .logo {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 28px; font-weight: 700; color: var(--text);
            margin-bottom: 24px; letter-spacing: -0.02em;
        }
        .logo-dot {
            display: inline-block; width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent); margin-left: 1px; vertical-align: middle; margin-bottom: 3px;
            box-shadow: 0 0 12px rgba(212,176,140,0.3);
        }
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 28px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em;
        }
        .subtitle { color: var(--text-muted); margin-bottom: 28px; font-size: 14px; line-height: 1.6; }

        .form-group { margin-bottom: 16px; }
        .form-control {
            width: 100%; padding: 13px 16px; border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 15px;
            color: var(--text); background: var(--bg); outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(212,176,140,0.08); }
        .form-control::placeholder { color: var(--text-faint); }

        .btn-submit {
            width: 100%; padding: 14px; background: var(--accent); color: #0D0D0D;
            border: none; border-radius: 10px; font-family: 'Inter', sans-serif;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.25s;
        }
        .btn-submit:hover { background: #E0C4A0; box-shadow: 0 8px 24px rgba(212,176,140,0.25); }

        .error-box {
            background: var(--error-bg); color: var(--error); padding: 12px 16px;
            border-radius: 10px; font-size: 14px; margin-bottom: 18px; border: 1px solid rgba(212,117,107,0.2);
        }
        .password-wrap { position: relative; margin-bottom: 16px; }
        .password-wrap .form-control { padding-right: 48px; }
        .toggle-password {
            position: absolute; top: 50%; right: 14px; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: var(--text-faint);
            font-size: 18px; padding: 2px;
        }
        .alt-link {
            margin-top: 20px; text-align: center; font-size: 13px; color: var(--text-muted);
        }
        .alt-link a { color: var(--accent); text-decoration: none; font-weight: 500; transition: opacity 0.2s; }
        .alt-link a:hover { opacity: 0.8; }
        .back-link { display: block; text-align: center; margin-top: 12px; color: var(--text-faint); font-size: 13px; text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: var(--text-muted); }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="logo">Mortea<span class="logo-dot"></span></div>
        <h1>Client Sign In</h1>
        <p class="subtitle">Access your bookings, saved providers, and appointment history.</p>

        {% if error_message %}
            <div class="error-box">{{ error_message }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="email" name="email" class="form-control" placeholder="Email address" required style="margin-bottom:16px">
            <div class="password-wrap">
                <input type="password" name="password" id="client-login-password" class="form-control" placeholder="Password" required>
                <button type="button" class="toggle-password" onclick="togglePassword()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="alt-link">
            <a href="{% url 'client_password_reset' %}">Forgot your password?</a>
        </div>
        <a href="{% url 'choose_login' %}" class="back-link">← Back to access options</a>
    </div>
</div>

<script>
function togglePassword() {
    const input = document.getElementById('client-login-password');
    input.type = input.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
