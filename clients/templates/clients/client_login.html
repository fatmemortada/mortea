<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Client Login — Mortacc</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial;
            background: #fdfbf8;
            margin: 0;
        }

        .wrap {
            max-width: 460px;
            margin: 80px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 36px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .logo span {
            color: #b8956a;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .subtitle {
            color: #7b6f64;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 12px 44px 12px 12px;
            margin-bottom: 14px;
            border-radius: 20px;
            border: 1px solid #e9dfd2;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #b8956a;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
        }

        button.main-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 20px;
            background: #b8956a;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button.main-btn:hover {
            background: #1e40af;
        }

        .error {
            background: #fef2f2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .alt-link {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            color: #7b6f64;
        }

        .password-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="wrap">
    <div class="card">

        <div class="logo">Mort<span>acc</span></div>

        <h1>Client Login</h1>
        <p class="subtitle">
            Access your portal, documents, and signed engagement letter.
        </p>

        {% if error_message %}
            <div class="error">{{ error_message }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input type="email" name="email" placeholder="Email address" required>

            <div class="password-wrap">
                <input type="password" name="password" id="client-login-password" placeholder="Password" required>
                <button type="button" class="toggle-password" onclick="togglePassword()">👁</button>
            </div>

            <button type="submit" class="main-btn">
                Log In
            </button>
        </form>

        <div class="alt-link">
            <a href="{% url 'client_password_reset' %}" style="color: #2563eb; text-decoration: none;">Forgot your password?</a>
        </div>

    </div>
</div>

<script>
function togglePassword() {
    const input = document.getElementById('client-login-password');
    const btn = document.querySelector('.toggle-password');

    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁';
    }
}
</script>

</body>
</html>
