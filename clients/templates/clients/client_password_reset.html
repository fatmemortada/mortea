<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password — Mortacc</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,Arial;background:#f8fafc;margin:0}.wrap{max-width:440px;margin:80px auto;padding:20px}.card{background:#fff;padding:36px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.06)}.logo{font-family:'DM Serif Display',serif;font-size:26px;margin-bottom:20px}.logo span{color:#2563eb}h1{margin:0 0 8px;font-size:24px}.sub{color:#64748b;margin-bottom:24px;font-size:14px}input{width:100%;padding:12px;margin-bottom:14px;border-radius:8px;border:1px solid #e2e8f0;font-size:14px;box-sizing:border-box}input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}button{width:100%;padding:14px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer;font-size:15px}button:hover{background:#1d4ed8}.success{background:#dcfce7;color:#15803d;padding:12px;border-radius:8px;margin-bottom:15px;font-size:14px}.back{margin-top:16px;text-align:center;font-size:13px}.back a{color:#2563eb;text-decoration:none}</style></head>
<body><div class="wrap"><div class="card">
<div class="logo">Mort<span>acc</span></div>
<h1>Reset Password</h1><p class="sub">Enter your email and we'll send you a reset link.</p>
{% if success %}
<div class="success">If an account with that email exists, a password reset link has been sent. Check your inbox.</div>
{% endif %}
<form method="POST">{% csrf_token %}
<input type="email" name="email" placeholder="Email address" required>
<button type="submit">Send Reset Link</button>
</form>
<div class="back"><a href="{% url 'client_login' %}">← Back to login</a></div>
</div></div></body></html>
