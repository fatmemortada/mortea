<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Verify — Mortacc</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f8fafc;color:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.06);padding:36px;width:100%;max-width:400px;border:1px solid #e2e8f0}.logo{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:20px}.logo span{color:#2563eb}h1{font-size:20px;margin-bottom:8px}p{color:#64748b;font-size:14px;margin-bottom:20px}input{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid #e2e8f0;font-size:14px;text-align:center;letter-spacing:8px}input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}button{width:100%;padding:14px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer;font-size:15px}button:hover{background:#1d4ed8}.error{background:#fef2f2;color:#b91c1c;padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px}.alt{text-align:center;margin-top:16px;font-size:13px;color:#64748b}.alt a{color:#2563eb}</style></head>
<body><div class="card"><div class="logo">Mort<span>acc</span></div><h1>Two-Factor Authentication</h1><p>Enter the 6-digit code from your authenticator app, or use a backup code.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="POST">{% csrf_token %}<input type="text" name="token" placeholder="000000" maxlength="10" required autofocus autocomplete="off"><button type="submit">Verify</button></form>
<div class="alt"><a href="{% url 'logout' %}">Back to login</a></div></div></body></html>
