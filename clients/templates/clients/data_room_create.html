{% extends "clients/base.html" %}
{% block title %}New Data Room — Mortacc{% endblock %}
{% block nav_data_rooms %}active{% endblock %}
{% block topbar_title %}Create Data Room{% endblock %}
{% block content %}<div style="max-width:640px;"><div class="card"><div class="card-header"><span class="card-title">New Data Room</span></div><div class="card-body"><form method="POST">{% csrf_token %}<div class="form-group"><label class="form-label">Room Name</label><input class="form-control" name="name" required></div><div class="form-group"><label class="form-label">Client</label><select class="form-control" name="client_id">{% for c in clients %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div><div class="form-group"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3"></textarea></div><div class="form-group"><label class="form-label">NDA Required</label><select class="form-control" name="require_nda"><option value="0">No</option><option value="1">Yes</option></select></div><div class="form-group"><label class="form-label">Expiry (optional)</label><input class="form-control" type="date" name="expires_at"></div><button type="submit" class="btn btn-primary">Create Data Room</button></form></div></div></div>{% endblock %}
