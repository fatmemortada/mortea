{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Requests | Mortea</title>
<link rel="icon" type="image/svg+xml" href="{% static 'clients/icons/favicon.svg' %}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
{% load static %}<link rel="stylesheet" href="{% static 'clients/css/landing.css' %}">
<style>
.page { padding-top: 64px; min-height: 100vh; background: var(--bg-warm); display: flex; align-items: center; justify-content: center; }
.container { max-width: 440px; margin: 0 auto; padding: 48px 24px; text-align: center; }
h1 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
.sub { color: var(--ink-3); margin-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 32px; box-shadow: var(--shadow); }
.field { margin-bottom: 14px; }
.field input { width: 100%; padding: 14px 18px; font-family: 'Inter', sans-serif; font-size: 16px; border: 1.5px solid var(--border); border-radius: var(--radius); outline: none; }
.field input:focus { border-color: var(--brand); }
.btn { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border-radius: var(--radius-full); border: none; background: var(--brand); color: #fff; cursor: pointer; }
.btn:hover { background: var(--brand-dark); }
.link { display: block; margin-top: 14px; font-size: 14px; color: var(--brand); text-decoration: none; }
.link:hover { text-decoration: underline; }
</style></head><body>
<nav id="topNav"><div class="nav-inner"><a href="/" class="nav-logo">Mortea</a></div></nav>
<div class="page"><div class="container">
<h1>My Requests</h1><p class="sub">Enter your email to view your requests and provider quotes.</p>
<div class="card"><form method="POST">{% csrf_token %}
<div class="field"><input type="email" name="email" placeholder="Your email address" required></div>
<button type="submit" class="btn">View My Requests</button>
</form></div>
<a href="{% url 'submit_request' %}" class="link">+ Post a new request</a>
</div></div></body></html>
