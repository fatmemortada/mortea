{% extends "clients/base.html" %}
{% block title %}Org Chart — {{ client.name }} | Mortacc{% endblock %}
{% block topbar_title %}{{ client.name }} — Org Chart{% endblock %}

{% block extra_head %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  #chart-container { width: 100%; height: 75vh; border: var(--border); border-radius: var(--radius); background: #fafbfc; overflow: hidden; position: relative; }
  .node circle { fill: #fff; stroke: var(--primary); stroke-width: 2px; }
  .node text { font: 12px sans-serif; }
  .link { fill: none; stroke: #ccc; stroke-width: 1.5px; }
  .toolbar { display: flex; gap: 0.5rem; margin-bottom: var(--gap); align-items: center; }
  .legend { display: flex; gap: 1rem; font-size: 0.8rem; align-items: center; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
</style>
{% endblock %}

{% block content %}
<div class="toolbar">
  <button class="btn btn-ghost btn-sm" onclick="zoomIn()">+</button>
  <button class="btn btn-ghost btn-sm" onclick="zoomOut()">-</button>
  <button class="btn btn-ghost btn-sm" onclick="resetZoom()">Reset</button>
  <button class="btn btn-ghost btn-sm" onclick="exportSVG()">SVG</button>
  <button class="btn btn-ghost btn-sm" onclick="exportPNG()">PNG</button>
  <span style="flex:1;"></span>
  <div class="legend">
    <span><span class="legend-dot" style="background:var(--primary);"></span> Entity</span>
    <span><span class="legend-dot" style="background:var(--green);"></span> Director</span>
    <span><span class="legend-dot" style="background:#8b5cf6;"></span> Shareholder</span>
    <span><span class="legend-dot" style="background:#f59e0b;"></span> Appointment</span>
  </div>
</div>
<div id="chart-container"></div>

<script>
const data = {
  name: "{{ client.name|escapejs }}",
  type: "entity",
  status: "{{ client.status }}",
  children: [
    {% if profile %}
    { name: "{{ profile.jurisdiction|default:'Jurisdiction'|escapejs }}", type: "jurisdiction", children: [] },
    {% endif %}
    {% if directors %}
    { name: "Directors ({{ directors|length }})", type: "group", children: [
      {% for d in directors %}
      { name: "{{ d.full_name|escapejs }}", type: "director" }{% if not forloop.last %},{% endif %}
      {% endfor %}
    ]},
    {% endif %}
    {% if shareholders %}
    { name: "Shareholders ({{ shareholders|length }})", type: "group", children: [
      {% for s in shareholders %}
      { name: "{{ s.full_name|escapejs }}", type: "shareholder", shares: {{ s.num_shares|default:0 }} }{% if not forloop.last %},{% endif %}
      {% endfor %}
    ]},
    {% endif %}
    {% if appointments %}
    { name: "Appointments ({{ appointments|length }})", type: "group", children: [
      {% for a in appointments %}
      { name: "{{ a.person_name|escapejs }}", type: "appointment", role: "{{ a.get_role_display|escapejs }}" }{% if not forloop.last %},{% endif %}
      {% endfor %}
    ]},
    {% endif %}
    {% if registrations %}
    { name: "Registrations ({{ registrations|length }})", type: "group", children: [
      {% for r in registrations %}
      { name: "{{ r.registration_number|escapejs }}", type: "registration" }{% if not forloop.last %},{% endif %}
      {% endfor %}
    ]},
    {% endif %}
    {% if share_classes %}
    { name: "Share Classes ({{ share_classes|length }})", type: "group", children: [
      {% for sc in share_classes %}
      { name: "{{ sc.name|escapejs }}", type: "share_class" }{% if not forloop.last %},{% endif %}
      {% endfor %}
    ]}
    {% endif %}
  ]
};

const margin = {top:40, right:120, bottom:20, left:150};
const container = document.getElementById("chart-container");
const width = container.clientWidth, height = container.clientHeight;
const svg = d3.select("#chart-container").append("svg")
  .attr("width",width).attr("height",height).attr("id","org-svg");
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.3,2.5]).on("zoom",(e)=>g.attr("transform",e.transform)));

const root = d3.hierarchy(data);
d3.tree().size([height-margin.top-margin.bottom, width-margin.left-margin.right])(root);

const colors = {entity:"var(--primary)",director:"var(--green)",shareholder:"#8b5cf6",appointment:"#f59e0b",group:"#94a3b8",registration:"#06b6d4",share_class:"#ec4899",jurisdiction:"#64748b"};
function nc(d){return colors[d.data.type]||"#94a3b8";}

g.selectAll(".link").data(root.links()).enter().append("path").attr("class","link")
  .attr("d",d3.linkHorizontal().x(d=>d.y).y(d=>d.x));

const node = g.selectAll(".node").data(root.descendants()).enter().append("g")
  .attr("class","node").attr("transform",d=>"translate("+d.y+","+d.x+")");

node.append("circle").attr("r",d=>d.data.type==="entity"?14:d.data.type==="group"?8:10)
  .style("fill",d=>nc(d)).style("stroke",d=>d.data.type==="group"?"#cbd5e1":null);

node.append("text").attr("dy",d=>d.data.type==="entity"?-20:d.children?-14:18)
  .attr("text-anchor","middle").style("font-weight",d=>d.data.type==="entity"||d.data.type==="group"?"600":"400")
  .style("fill","#334155").text(d=>d.data.name.length>28?d.data.name.substring(0,26)+"...":d.data.name);

node.filter(d=>d.data.type==="shareholder"&&d.data.shares).append("text")
  .attr("dy",32).attr("text-anchor","middle").style("font-size","10px").style("fill","#94a3b8")
  .text(d=>d.data.shares+" shares");

function zoomIn(){svg.transition().call(d3.zoom().scaleBy,1.3);}
function zoomOut(){svg.transition().call(d3.zoom().scaleBy,0.7);}
function resetZoom(){svg.transition().call(d3.zoom().transform,d3.zoomIdentity);}
function exportSVG(){const s=new XMLSerializer().serializeToString(document.getElementById("org-svg"));const b=new Blob(["<?xml version=\"1.0\"?>"+s],{type:"image/svg+xml"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="org-chart.svg";a.click();URL.revokeObjectURL(u);}
function exportPNG(){const s=new XMLSerializer().serializeToString(document.getElementById("org-svg"));const c=document.createElement("canvas");c.width=width*2;c.height=height*2;const ctx=c.getContext("2d");const img=new Image();img.onload=function(){ctx.fillStyle="#fafbfc";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0);const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="org-chart.png";a.click();};img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(s)));}
</script>
{% endblock %}
