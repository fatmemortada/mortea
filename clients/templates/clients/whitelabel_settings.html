{% extends "clients/base.html" %}{% block title %}White-Label Settings — Mortacc{% endblock %}{% block nav_whitelabel %}active{% endblock %}{% block topbar_title %}White-Label Portal Settings{% endblock %}{% block content %}<div style="max-width:640px;"><div class="card"><div class="card-header"><span class="card-title">Portal Branding</span></div><div class="card-body"><form method="POST" enctype="multipart/form-data">{% csrf_token %}<div class="form-group"><label class="form-label">Portal Name</label><input class="form-control" name="name" value="{{ config.name|default:'' }}" placeholder="Your Firm Portal"></div><div class="form-group"><label class="form-label">Logo</label><input class="form-control" type="file" name="logo" accept="image/*"></div><div class="form-group"><label class="form-label">Primary Color</label><input class="form-control" type="color" name="primary_color" value="{{ config.primary_color|default:'#2563eb' }}"></div><div class="form-group"><label class="form-label">Custom Domain (optional)</label><input class="form-control" name="domain" value="{{ config.domain|default:'' }}" placeholder="portal.yourfirm.com"></div><div class="form-group"><label class="form-label">Portal URL Slug</label><input class="form-control" name="slug" value="{{ config.slug|default:'' }}" placeholder="your-firm"></div><button type="submit" class="btn btn-primary">Save Settings</button></form></div></div></div>{% endblock %}
