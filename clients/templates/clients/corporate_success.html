<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request submitted — Mortacc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        body{margin:0;font-family:'Sora',sans-serif;background:#0a0f1e;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
        .card{max-width:680px;background:#fff;color:#1e293b;border-radius:24px;padding:48px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}
        .icon{width:84px;height:84px;border-radius:50%;background:#f0fdf4;border:2px solid #22c55e;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 24px;color:#16a34a}
        h1{font-family:'DM Serif Display',serif;font-size:42px;margin:0 0 16px}
        p{font-size:16px;line-height:1.8;color:#475569;margin:0 0 28px}
        .btn{display:inline-block;background:#b8956a;color:#fff;text-decoration:none;padding:14px 24px;border-radius:12px;font-weight:700}
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1>Request submitted</h1>
        <p>Thank you. Your incorporation request and signed engagement confirmation were submitted successfully. Our team will review your information and contact you shortly.</p>
        <a class="btn" href="/corporate/">Back to Corporate Services</a>
    </div>
</body>
</html>
