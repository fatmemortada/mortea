<!DOCTYPE html>
<html>
<head>
    <title>Client Account Setup</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f6fa;
            padding: 40px;
        }

        .card {
            background: white;
            padding: 30px;
            max-width: 460px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        input {
            width: 100%;
            padding: 12px 44px 12px 12px;
            margin-bottom: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button.main-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2d6cdf;
            color: white;
            cursor: pointer;
        }

        .error {
            background: #fdecea;
            color: #b42318;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        .alt-link {
            margin-top: 15px;
            text-align: center;
        }

        .password-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        .password-wrap input {
            margin-bottom: 0;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Activate Client Account</h1>
    <p class="subtitle">
        Enter the email set by your firm, your onboarding token, and create your password.
    </p>

    {% if error_message %}
        <div class="error">{{ error_message }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <input type="email" name="email" placeholder="Email address" required>
        <input type="text" name="client_token" placeholder="Onboarding token (example: FAT2026041301)" required>

        <div class="password-wrap">
            <input type="password" name="password" id="client-setup-password" placeholder="Create password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('client-setup-password', this)">👁</button>
        </div>

        <div class="password-wrap">
            <input type="password" name="confirm_password" id="client-setup-confirm-password" placeholder="Confirm password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('client-setup-confirm-password', this)">👁</button>
        </div>

        <button type="submit" class="main-btn">Activate Account</button>
    </form>

    <div class="alt-link">
        <a href="{% url 'client_login' %}">Already activated? Client login</a>
    </div>
</div>

<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁';
    }
}
</script>

</body>
</html>
