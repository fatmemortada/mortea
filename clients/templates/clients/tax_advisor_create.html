{% extends "clients/base.html" %}{% block title %}New Tax Strategy — Mortacc{% endblock %}{% block nav_tax %}active{% endblock %}{% block topbar_title %}Create Tax Strategy{% endblock %}{% block content %}<div style="max-width:640px;"><div class="card"><div class="card-header"><span class="card-title">New Tax Strategy</span></div><div class="card-body"><form method="POST">{% csrf_token %}<div class="form-group"><label class="form-label">Strategy Name</label><input class="form-control" name="name" required></div><div class="form-group"><label class="form-label">Entity</label><select class="form-control" name="client_id"><option value="{{ client.id }}">{{ client.name }}</option></select></div><div class="form-grid-2"><div class="form-group"><label class="form-label">Scenario: Income</label><input class="form-control" name="income" type="number" step="0.01" placeholder="0"></div><div class="form-group"><label class="form-label">Scenario: Bonus</label><input class="form-control" name="bonus" type="number" step="0.01" placeholder="0"></div></div><div class="form-group"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3"></textarea></div><button type="submit" class="btn btn-primary">Generate Strategy</button></form></div></div></div>{% endblock %}
