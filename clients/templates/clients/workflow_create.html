{% extends "clients/base.html" %}{% block title %}New Workflow — Mortacc{% endblock %}{% block nav_workflows %}active{% endblock %}{% block topbar_title %}Create Workflow{% endblock %}{% block content %}<div style="max-width:700px;"><div class="card"><div class="card-header"><span class="card-title">New Automation Workflow</span></div><div class="card-body"><form method="POST">{% csrf_token %}<div class="form-group"><label class="form-label">Workflow Name</label><input class="form-control" name="name" required placeholder="e.g., New Client Onboarding"></div><div class="form-group"><label class="form-label">Trigger</label><select class="form-control" name="trigger_type"><option value="client_created">When client is created</option><option value="incorporation_completed">When incorporation completes</option><option value="compliance_due">When compliance task becomes due</option><option value="invoice_overdue">When invoice is overdue</option><option value="manual">Manual trigger only</option></select></div><div class="form-group"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3"></textarea></div><div id="steps-container"><label class="form-label">Steps</label><div class="step-row" style="display:flex;gap:8px;margin-bottom:8px;"><select class="form-control" name="step_action_0"><option value="">Select action…</option>{% for a in available_actions %}<option value="{{ a.key }}">{{ a.name }}</option>{% endfor %}</select><input class="form-control" name="step_config_0" placeholder="Config JSON" style="flex:2;"></div></div><button type="button" class="btn btn-ghost btn-sm" onclick="addStep()">+ Add Step</button><button type="submit" class="btn btn-primary" style="margin-top:16px;display:block;">Create Workflow</button></form></div></div></div>{% endblock %}{% block extra_scripts %}<script>let stepCount=1;function addStep(){var d=document.createElement('div');d.className='step-row';d.style.cssText='display:flex;gap:8px;margin-bottom:8px;';d.innerHTML='<select class="form-control" name="step_action_'+stepCount+'">{% for a in available_actions %}<option value="{{ a.key }}">{{ a.name }}</option>{% endfor %}</select><input class="form-control" name="step_config_'+stepCount+'" placeholder="Config JSON" style="flex:2;">';document.getElementById('steps-container').appendChild(d);stepCount++;}</script>{% endblock %}
